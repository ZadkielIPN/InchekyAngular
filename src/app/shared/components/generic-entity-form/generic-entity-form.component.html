<main class="page">
  <div class="page-heading">
    <h1>{{ id ? 'Editar' : 'Nuevo' }} {{ title }}</h1>
  </div>

  <form class="panel" [formGroup]="form" (ngSubmit)="save()">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label" for="nombre">Nombre</label>
        <input id="nombre" class="form-control" formControlName="nombre" />
      </div>

      @if (endpoint === 'clientes') {
        <div class="col-md-6">
          <label class="form-label" for="apellido">Apellido</label>
          <input id="apellido" class="form-control" formControlName="apellido" />
        </div>
        <div class="col-md-6">
          <label class="form-label" for="email">Correo electrónico</label>
          <input id="email" class="form-control" type="email" formControlName="email" />
        </div>
        <div class="col-md-6">
          <label class="form-label" for="contrasena">
            {{ id ? 'Nueva contraseña (opcional)' : 'Contraseña' }}
          </label>
          <input
            id="contrasena"
            class="form-control"
            type="password"
            formControlName="contrasena"
            minlength="8"
            maxlength="20"
          />
          <small class="form-text text-muted">
            {{ id ? 'Déjala vacía para conservar la contraseña actual.' : 'Debe tener entre 8 y 20 caracteres.' }}
          </small>
        </div>
        <div class="col-md-3">
          <label class="form-label" for="puntos">Puntos</label>
          <input id="puntos" class="form-control" type="number" formControlName="puntos" />
        </div>
        <div class="col-md-3">
          <label class="form-label" for="nivelLealtad">Nivel</label>
          <select id="nivelLealtad" class="form-select" formControlName="nivelLealtad">
            <option value="BRONCE">Bronce</option>
            <option value="PLATA">Plata</option>
            <option value="ORO">Oro</option>
            <option value="PLATINO">Platino</option>
          </select>
        </div>
      }

      @if (endpoint === 'promociones') {
        <div class="col-md-4">
          <label class="form-label" for="porcentajeDescuento">Descuento (%)</label>
          <input
            id="porcentajeDescuento"
            class="form-control"
            type="number"
            min="0"
            max="100"
            formControlName="porcentajeDescuento"
          />
        </div>
        <div class="col-md-4">
          <label class="form-label" for="fechaInicio">Fecha de inicio</label>
          <input id="fechaInicio" class="form-control" type="date" formControlName="fechaInicio" />
        </div>
        <div class="col-md-4">
          <label class="form-label" for="fechaFin">Fecha de fin</label>
          <input id="fechaFin" class="form-control" type="date" formControlName="fechaFin" />
        </div>
        <div class="col-12 form-check ms-2">
          <input id="activa" class="form-check-input" type="checkbox" formControlName="activa" />
          <label class="form-check-label" for="activa">Promoción activa</label>
        </div>
      }
    </div>

    @if (error()) {
      <div class="notice error mt-3" role="alert">{{ error() }}</div>
    }

    <div class="d-flex gap-2 mt-4">
      <button class="btn btn-primary" type="submit">
        <i class="bi bi-check-lg"></i>
        Guardar
      </button>
      <a class="btn btn-outline-secondary" [routerLink]="['/', endpoint]">Cancelar</a>
    </div>
  </form>
</main>
