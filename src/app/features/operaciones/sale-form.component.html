<main class="page">
  <div class="page-heading">
    <div>
      <h1>Nueva venta</h1>
      <p class="muted mb-0">Registra la operación y sus productos.</p>
    </div>
  </div>

  <form class="panel" [formGroup]="form" (ngSubmit)="save()">
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label" for="fecha">Fecha</label>
        <input id="fecha" class="form-control" type="datetime-local" formControlName="fecha" />
      </div>
      <div class="col-md-4">
        <label class="form-label" for="cajeroId">Cajero</label>
        <select id="cajeroId" class="form-select" formControlName="cajeroId">
          <option [ngValue]="0">Selecciona un cajero</option>
          @for (cashier of cashiers(); track cashier.id) {
            <option [ngValue]="cashier.id">{{ cashier.nombre }} {{ cashier.apellido }}</option>
          }
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="clienteId">Cliente</label>
        <select id="clienteId" class="form-select" formControlName="clienteId">
          <option [ngValue]="0">Venta sin cliente</option>
          @for (client of clients(); track client.id) {
            <option [ngValue]="client.id">{{ client.nombre }} {{ client.apellido }}</option>
          }
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="metodoPago">Método de pago</label>
        <select id="metodoPago" class="form-select" formControlName="metodoPago">
          <option value="EFECTIVO">Efectivo</option>
          <option value="TARJETA">Tarjeta</option>
          <option value="TRANSFERENCIA">Transferencia</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="puntosUtilizados">Puntos utilizados</label>
        <input
          id="puntosUtilizados"
          class="form-control"
          type="number"
          formControlName="puntosUtilizados"
        />
      </div>
    </div>

    <hr class="my-4" />

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="h5 mb-0">Detalle de venta</h2>
      <button class="btn btn-outline-primary btn-sm" type="button" (click)="addDetail()">
        <i class="bi bi-plus-lg"></i>
        Agregar producto
      </button>
    </div>

    <div formArrayName="detalles" class="vstack gap-3">
      @for (detail of details.controls; track $index) {
        <div class="row g-2 align-items-end" [formGroupName]="$index">
          <div class="col-md-6">
            <label class="form-label">Producto</label>
            <select class="form-select" formControlName="productoId">
              <option [ngValue]="0">Selecciona un producto</option>
              @for (product of products(); track product.id) {
                <option [ngValue]="product.id">{{ product.nombre }}</option>
              }
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label">Cantidad</label>
            <input class="form-control" type="number" min="1" formControlName="cantidad" />
          </div>
          <div class="col-md-3">
            <label class="form-label">Precio unitario</label>
            <input
              class="form-control"
              type="number"
              min="0"
              step="0.01"
              formControlName="precioUnitario"
            />
          </div>
          <div class="col-md-1">
            <button class="btn btn-outline-danger" type="button" (click)="removeDetail($index)">
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </div>
      }
    </div>

    @if (error()) {
      <div class="notice error mt-4" role="alert">{{ error() }}</div>
    }

    <div class="d-flex gap-2 mt-4">
      <button class="btn btn-primary" type="submit">
        <i class="bi bi-check-lg"></i>
        Registrar venta
      </button>
      <a class="btn btn-outline-secondary" routerLink="/ventas">Cancelar</a>
    </div>
  </form>
</main>
