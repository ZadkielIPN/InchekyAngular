<main class="page narrow-page">
  <div class="page-heading">
    <div><h1>Mi perfil</h1><p class="muted">Actualiza tus datos personales.</p></div>
  </div>
  <form class="card form-card" (ngSubmit)="submit()">
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label">Nombre</label><input class="form-control" name="nombre" [(ngModel)]="nombre" required /></div>
      <div class="col-md-6"><label class="form-label">Apellido</label><input class="form-control" name="apellido" [(ngModel)]="apellido" required /></div>
      <div class="col-12"><label class="form-label">Correo electrónico</label><input class="form-control" type="email" name="email" [(ngModel)]="email" required /></div>
      <div class="col-12"><label class="form-label">Nueva contraseña <span class="muted">(opcional)</span></label><input class="form-control" type="password" name="contrasena" [(ngModel)]="contrasena" minlength="8" /></div>
    </div>
    @if (message()) { <div class="notice success mt-3">{{ message() }}</div> }
    @if (error()) { <div class="notice error mt-3">{{ error() }}</div> }
    <div class="form-actions"><button class="btn btn-primary" type="submit">Guardar cambios</button></div>
  </form>
</main>
