<main class="auth-page">
  <form class="card auth-card" (ngSubmit)="submit()">
    <div class="text-center mb-4">
      <div class="auth-logo">
        <img ngSrc="/images/logo.png" alt="Incheky" width="352" height="266" />
      </div>
      <h1 class="h3 mb-2">Bienvenido a Incheky</h1>
      <p class="muted mb-0">Tienda de abarrotes</p>
    </div>

    <div class="mb-3">
      <label class="form-label" for="email">Correo electrónico</label>
      <input
        id="email"
        class="form-control"
        type="email"
        name="email"
        [(ngModel)]="email"
        required
      />
    </div>

    <div class="mb-3">
      <label class="form-label" for="contrasena">Contraseña</label>
      <input
        id="contrasena"
        class="form-control"
        type="password"
        name="contrasena"
        [(ngModel)]="contrasena"
        minlength="8"
        required
      />
    </div>

    @if (error()) {
      <div class="notice error mb-3" role="alert">
        {{ error() }}
      </div>
    }

    <button class="btn btn-primary w-100" type="submit" [disabled]="auth.loading()">
      @if (auth.loading()) {
        <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
      }
      Iniciar sesión
    </button>
    <div class="text-center mt-2">
      @if (nfcMode()) {
        <button class="btn btn-link" type="button" (click)="disableNfcLogin()">
          Usar correo y contraseña
        </button>
        <div
          class="nfc-login mt-2"
          [class.nfc-error]="nfcStatus() === 'error'"
          role="status"
          aria-live="polite"
        >
          <i class="bi bi-credit-card-2-front" aria-hidden="true"></i>
          <span>{{ nfcMessage() || 'Acerca la tarjeta al lector' }}</span>
          <input
            #nfcInput
            class="visually-hidden"
            type="text"
            name="nfcUid"
            autocomplete="off"
            inputmode="numeric"
            aria-label="Lectura de tarjeta NFC"
            [value]="nfcUid()"
            (input)="onNfcInput(nfcInput.value)"
            (keydown.enter)="$event.preventDefault(); submitNfc()"
            [disabled]="nfcStatus() === 'loading'"
          />
        </div>
      } @else {
        <button class="btn btn-link" type="button" (click)="enableNfcLogin()">
          Iniciar sesión con tarjeta NFC
        </button>
      }
    </div>
    <p class="text-center mt-3 mb-0">
      ¿Eres cliente nuevo? <a routerLink="/registro">Crear cuenta</a>
    </p>
  </form>
</main>
