<main class="auth-page">
  <form class="card auth-card" (ngSubmit)="submit()">
    <div class="text-center mb-4">
      <div class="auth-logo"><i class="bi bi-person-plus"></i></div>
      <h1 class="h3 mb-2">Crear cuenta</h1>
      <p class="muted mb-0">Regístrate como cliente de Incheky</p>
    </div>

    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label" for="nombre">Nombre</label>
        <input id="nombre" class="form-control" name="nombre" [(ngModel)]="nombre" required />
      </div>
      <div class="col-md-6">
        <label class="form-label" for="apellido">Apellido</label>
        <input id="apellido" class="form-control" name="apellido" [(ngModel)]="apellido" required />
      </div>
    </div>

    <div class="mb-3 mt-3">
      <label class="form-label" for="email">Correo electrónico</label>
      <input id="email" class="form-control" type="email" name="email" [(ngModel)]="email" required />
    </div>

    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <label class="form-label" for="contrasena">Contraseña</label>
        <input id="contrasena" class="form-control" type="password" name="contrasena"
               [(ngModel)]="contrasena" minlength="8" required />
      </div>
      <div class="col-md-6">
        <label class="form-label" for="confirmarContrasena">Confirmar contraseña</label>
        <input id="confirmarContrasena" class="form-control" type="password" name="confirmarContrasena"
               [(ngModel)]="confirmarContrasena" minlength="8" required />
      </div>
    </div>

    @if (error()) {
      <div class="notice error mb-3" role="alert">{{ error() }}</div>
    }

    <button class="btn btn-primary w-100" type="submit" [disabled]="auth.loading()">
      @if (auth.loading()) { <span class="spinner-border spinner-border-sm me-2"></span> }
      Crear cuenta
    </button>
    <p class="text-center mt-3 mb-0">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
    </p>
  </form>
</main>
