<main class="page">
  <div class="page-heading">
    <h1>{{ id ? 'Editar' : 'Nuevo' }} producto</h1>
  </div>

  <form class="panel" [formGroup]="form" (ngSubmit)="save()">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label" for="nombre">Nombre</label>
        <input id="nombre" class="form-control" formControlName="nombre" />
      </div>
      <div class="col-md-6">
        <label class="form-label" for="codigoBarras">Código de barras</label>
        <input id="codigoBarras" class="form-control" formControlName="codigoBarras" />
      </div>
      <div class="col-12">
        <label class="form-label" for="descripcion">Descripción</label>
        <textarea id="descripcion" class="form-control" rows="3" formControlName="descripcion"></textarea>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="precio">Precio</label>
        <input id="precio" class="form-control" type="number" min="0" step="0.01" formControlName="precio" />
      </div>
      <div class="col-md-4">
        <label class="form-label" for="stock">Stock</label>
        <input id="stock" class="form-control" type="number" min="0" formControlName="stock" />
      </div>
      <div class="col-md-4">
        <label class="form-label" for="peso">Peso</label>
        <input id="peso" class="form-control" type="number" min="0" step="0.01" formControlName="peso" />
      </div>
      <div class="col-md-4">
        <label class="form-label" for="unidadMedida">Unidad de medida</label>
        <select id="unidadMedida" class="form-select" formControlName="unidadMedida">
          @for (unit of units; track unit) {
            <option [value]="unit">{{ unit }}</option>
          }
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="fechaCaducidad">Fecha de caducidad</label>
        <input id="fechaCaducidad" class="form-control" type="date" formControlName="fechaCaducidad" />
      </div>
      <div class="col-md-4">
        <label class="form-label" for="imagen">Imagen</label>
        <input id="imagen" class="form-control" type="file" accept="image/*" (change)="selectFile($event)" />
      </div>
      <div class="col-12 form-check ms-2">
        <input id="activo" class="form-check-input" type="checkbox" formControlName="activo" />
        <label class="form-check-label" for="activo">Producto activo</label>
      </div>
    </div>

    @if (error()) {
      <div class="notice error mt-3" role="alert">{{ error() }}</div>
    }

    <div class="d-flex gap-2 mt-4">
      <button class="btn btn-primary" type="submit">
        <i class="bi bi-check-lg"></i>
        Guardar
      </button>
      <a class="btn btn-outline-secondary" routerLink="/productos">Cancelar</a>
    </div>
  </form>
</main>
